aid: curri
name: Curri
description: >-
  Curri is a last-mile and same-day delivery platform built for construction and
  industrial supplies. It lets distributors and suppliers dispatch on-demand
  drivers (Hotshots), run dedicated recurring fleets, and orchestrate a vetted
  nationwide carrier network including LTL freight — with smart vehicle matching,
  live tracking and ETAs, digital proof-of-delivery, and route planning. Curri's
  GraphQL API (https://api.curri.com/graphql) connects a customer's own systems
  to the platform so they can request quotes, book and manage deliveries, and
  track drivers in real time without logging into the app. Authentication is HTTP
  Basic with an issued API key plus a separate Sandbox key for test bookings.
